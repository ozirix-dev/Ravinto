{% if page.translations %}
  {% assign default_translation = page.translations | where: 'hreflang', 'fi-FI' | first %}
  {% for translation in page.translations %}
<link rel="alternate" hreflang="{{ translation.hreflang | escape }}" href="{{ translation.url | absolute_url | escape }}">
  {% endfor %}
  {% if default_translation %}
<link rel="alternate" hreflang="x-default" href="{{ default_translation.url | absolute_url | escape }}">
  {% endif %}
{% endif %}
